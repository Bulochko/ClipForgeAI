name: Windows x64 build
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build portable and installer
        shell: pwsh
        run: .\build\build_windows.ps1 -Python python
      - name: Smoke test packaged executable
        shell: pwsh
        run: |
          $exe = Resolve-Path "dist\ClipForgeAI\ClipForge AI.exe"
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) {
            if ($p.ExitCode -ne 0) { throw "GUI exited early with code $($p.ExitCode)" }
          } else {
            Stop-Process -Id $p.Id -Force
          }
      - name: Package portable ZIP
        run: Compress-Archive -Path dist\ClipForgeAI\* -DestinationPath dist\ClipForgeAI-portable-win64.zip -Force
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ClipForgeAI-Windows-x64
          path: |
            dist/ClipForgeAI-portable-win64.zip
            dist/installer/*.exe
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ClipForgeAI-portable-win64.zip
            dist/installer/*.exe
