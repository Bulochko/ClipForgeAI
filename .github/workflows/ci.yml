name: CI

on:
  push:
    branches: [main, "audit/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check JavaScript syntax
        run: |
          for file in src/*.mjs tests/*.mjs; do
            node --check "$file"
          done
          bash -n deploy/setup.sh
      - name: Run tests
        run: npm test
      - name: Build Docker image
        run: docker build -t lyra-ai:ci .
